name: run bovada

# on: [push]
# on:
  # schedule:
  #   - cron: "00 23 * * *"    #runs at 23:00 UTC everyday

on:
  # Schedule the workflow to run every day at 1:00 AM (UTC)
  schedule:
    - cron: '15 * * * *'
  # Allows the workflow to be triggered manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v3 # Checkout the repository content to github runner.

      - name: Setup Python Version
        uses: actions/setup-python@v4
        with:
          python-version: 3.9 # Install the python version needed

      - name: Install Python dependencies
        # run: python -m pip install --upgrade pip requests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100
        
      - name: Execute Python script # Run the run.py to get the latest data
        run: python scripts/bovada.py

      - name: List files before push
        run: |
          ls -la
          git status

      - name: Commit and push changes
        run: |
          git config --global user.name "aaron"
          git config --global user.email "aaroncolesmith@gmail.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            # data/bovada_data.parquet is rewritten in full every run, so a new
            # commit each hour balloons repo history forever (this is what got
            # the repo to 100GB). Roll automated "Update data" commits into one
            # instead of stacking a new binary blob every run.
            if [ "$(git log -1 --pretty=%s)" = "Update data" ]; then
              git commit --amend -m "Update data"
            else
              git commit -m "Update data"
            fi
            git push --force
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.BET_MODEL_GITHUB_TOKEN }}
